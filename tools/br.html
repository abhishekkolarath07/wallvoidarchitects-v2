<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>br</title>
<style>html,body{margin:0;background:#111}#log{color:#0f0;font:11px monospace;padding:4px}#wrap{width:1600px}#wrap img{display:block;width:1600px}</style>
</head>
<body>
<div id="log">…</div>
<div id="wrap"></div>
<script type="module">
import * as pdfjs from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs';
pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.min.mjs';
const logEl = document.getElementById('log'), wrap = document.getElementById('wrap');
const doc = await pdfjs.getDocument('../docs/blueridge.pdf').promise;
window.__n = doc.numPages;
window.__show = async (from, count) => {
  wrap.innerHTML = '';
  for (let i = from; i < from + count && i <= doc.numPages; i++) {
    const page = await doc.getPage(i);
    const vp = page.getViewport({ scale: 1600 / page.getViewport({ scale: 1 }).width });
    const c = document.createElement('canvas');
    c.width = vp.width; c.height = vp.height;
    await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    const img = document.createElement('img');
    img.src = c.toDataURL('image/jpeg', 0.9);
    img.dataset.page = i;
    wrap.appendChild(img);
    await img.decode().catch(()=>{});
  }
  logEl.textContent = 'shown ' + from + '..' + (from+count-1) + ' of ' + doc.numPages;
  return 'ok';
};
window.__ready = true;
logEl.textContent = 'ready, pages ' + doc.numPages;
</script>
</body></html>
