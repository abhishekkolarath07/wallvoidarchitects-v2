<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>extract</title>
<style>html,body{margin:0;background:#111;height:100%}#one{display:block;width:100%;height:auto}#log{color:#0f0;font:11px monospace;padding:4px}</style>
</head>
<body>
<div id="log">working…</div>
<img id="one" alt="">
<script type="module">
import * as pdfjs from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs';
pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.min.mjs';
const logEl = document.getElementById('log');
const doc = await pdfjs.getDocument('../uploads/wva-profile.pdf').promise;
const found = [];
window.__found = found;
window.__extract = async (from, to) => {
  for (let i = from; i <= Math.min(to, doc.numPages); i++) {
    const page = await doc.getPage(i);
    const ops = await page.getOperatorList();
    const names = [];
    for (let k = 0; k < ops.fnArray.length; k++) {
      const fn = ops.fnArray[k];
      if (fn === pdfjs.OPS.paintImageXObject || fn === pdfjs.OPS.paintJpegXObject) names.push(ops.argsArray[k][0]);
    }
    for (const nm of new Set(names)) {
      let obj;
      try { obj = page.objs.get(nm); } catch (e) {
        try { obj = await new Promise(r => page.objs.get(nm, r)); } catch (e2) { continue; }
      }
      if (!obj) continue;
      const w = obj.width, h = obj.height;
      if (!w || w < 500 || h < 300) continue;
      found.push({ page: i, name: nm, w, h, obj });
    }
    logEl.textContent = 'page ' + i + ' → total imgs ' + found.length;
  }
  return found.map(f => ({ page: f.page, name: f.name, w: f.w, h: f.h }));
};
function toCanvas(obj) {
  const c = document.createElement('canvas');
  c.width = obj.width; c.height = obj.height;
  const ctx = c.getContext('2d');
  if (obj.bitmap) { ctx.drawImage(obj.bitmap, 0, 0); return c; }
  const src = obj.data;
  const out = ctx.createImageData(obj.width, obj.height);
  const n = obj.width * obj.height;
  if (src.length === n * 4) out.data.set(src);
  else if (src.length === n * 3) { for (let i = 0; i < n; i++) { out.data[i*4]=src[i*3]; out.data[i*4+1]=src[i*3+1]; out.data[i*4+2]=src[i*3+2]; out.data[i*4+3]=255; } }
  else if (src.length === n) { for (let i = 0; i < n; i++) { out.data[i*4]=out.data[i*4+1]=out.data[i*4+2]=src[i]; out.data[i*4+3]=255; } }
  else return null;
  ctx.putImageData(out, 0, 0);
  return c;
}
window.__showImg = (idx) => {
  const f = found[idx];
  const img = document.getElementById('one');
  if (!f) { img.removeAttribute('src'); logEl.textContent = 'none ' + idx; return; }
  const c = toCanvas(f.obj);
  img.src = c ? c.toDataURL('image/jpeg', 0.85) : '';
  logEl.textContent = idx + ' p' + f.page + ' ' + f.w + 'x' + f.h;
};
window.__ready = true;
logEl.textContent = 'ready, pages ' + doc.numPages;
</script>
</body></html>
